[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-web2api"
version = "0.2.0"
description = "OpenAI-compatible API proxy and MCP server for ChatGPT web — drives Chrome via CDP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Elephant Rock Lab"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
keywords = ["chatgpt", "openai", "mcp", "cdp", "proxy", "api"]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/Elephant-Rock-Lab/ChatGPT-Web2API"
Repository = "https://github.com/Elephant-Rock-Lab/ChatGPT-Web2API"
Issues = "https://github.com/Elephant-Rock-Lab/ChatGPT-Web2API/issues"
Changelog = "https://github.com/Elephant-Rock-Lab/ChatGPT-Web2API/blob/master/CHANGELOG.md"

[project.scripts]
chatgpt-web2api = "chatgpt_web2api.__main__:main"
chatgpt-web2api-mcp = "chatgpt_web2api.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_web2api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
